services:
  # ===============================
  # MagicNav应用服务
  # ===============================
  app:
    build: .
    container_name: magicnav-app
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - db
    # entrypoint 脚本生成 .env
    entrypoint: |-
      sh -c '
      [ -f /app/.env ] || (cp /app/.env.example /app/.env && \
        sed -i "s|\[YOUR_NEXTAUTH_SECRET\]|$(node -e 'console.log(require(\"crypto\").randomUUID())')|g" /app/.env
      exec "$@"
      '
    networks:
      - magicnav-network

  # ===============================
  # 本地 PostgreSQL 数据库服务
  # ===============================
  db:
    image: postgres:15-alpine
    container_name: magicnav-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: magicnav
      POSTGRES_PASSWORD: magicnavpassword
      POSTGRES_DB: magicnav
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - magicnav-network

# ===============================
# 数据卷
# ===============================
volumes:
  postgres_data:
    name: magicnav-postgres-data

# ===============================
# 网络配置
# ===============================
networks:
  magicnav-network:
    name: magicnav-network
    driver: bridge