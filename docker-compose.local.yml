version: '3.8'

services:
  # ===============================
  # 初始化服务（自动创建.env文件）
  # ===============================
  init:
    image: alpine:latest
    container_name: magicnav-init
    command: >
      sh -c 'if [ ! -f /app/.env ]; then 
        cp /app/.env.example /app/.env; 
        # 生成随机密码（使用uuidgen的前12个字符，足够安全且便于记忆）
        RANDOM_PASSWORD=$(uuidgen | cut -c1-12); 
        sed -i "s/\[YOUR_DB_PASSWORD\]/$RANDOM_PASSWORD/g" /app/.env; 
        # 生成随机NextAuth密钥
        NEXTAUTH_SECRET=$(uuidgen); 
        sed -i "s/\[YOUR_NEXTAUTH_SECRET\]/$NEXTAUTH_SECRET/g" /app/.env; 
        echo "Created .env file from .env.example with random password and NextAuth secret"; 
        echo "Database password: $RANDOM_PASSWORD"; 
      else 
        echo ".env file already exists"; 
      fi'
    volumes:
      - ./:/app
    restart: "no"
    networks:
      - magicnav-network

  # ===============================
  # MagicNav应用服务（核心服务）
  # ===============================
  app:
    build: .
    container_name: magicnav-app
    restart: always
    ports:
      - "3000:3000"
    # 使用环境变量文件
    env_file:
      - .env
    environment:
      # 数据库连接配置（本地数据库模式使用）
      - POSTGRES_USER=${POSTGRES_USER:-magicnav}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-magicnav}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      # 数据库连接URL（本地数据库模式）
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-magicnav}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-magicnav}?schema=public}
      # NextAuth认证配置
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      # 管理员配置
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      # 应用URL配置
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # logo.dev API Key（可选）
      - LOGO_DEV_API_KEY=${LOGO_DEV_API_KEY}
    # 依赖初始化服务和本地数据库服务
    depends_on:
      - init
      - db
    networks:
      - magicnav-network

  # ===============================
  # 本地PostgreSQL数据库服务
  # ===============================
  db:
    image: postgres:15-alpine
    container_name: magicnav-db
    restart: always
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-magicnav}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-magicnav}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - magicnav-network

# ===============================
# 数据卷配置
# ===============================
volumes:
  postgres_data:
    name: magicnav-postgres-data

# ===============================
# 网络配置
# ===============================
networks:
  magicnav-network:
    name: magicnav-network
    driver: bridge